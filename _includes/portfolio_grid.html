<!-- INFRAESTRUTURA -->
<section id="portfolio">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Infraestrutura</h2>
        <hr style="
          width: 60%; 
          height: 4px; 
          background: #000000; 
          border: none; 
          margin: 10px auto; 
          border-radius: 50px; /* Deixa as pontas arredondadas */
         ">
      </div>

    </div>
    <div class="portfolio-flex-row">
      {% for post in site.posts %}
      <div class="portfolio-flex-item portfolio-item">
        <div class="image-text-hover">
        <a href="#portfolioModal-{{ post.modal-id }}" class="portfolio-link" data-toggle="modal">
          
            <div class="overlay-text">
              <span class="overlay-content">{{ post.overlay-text }}</span>
            </div>
          
          <img src="img/portfolio/{{ post.img }}" class="img-responsive" alt="{{ post.alt }}">
        </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
